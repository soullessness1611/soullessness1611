<svg xmlns="http://www.w3.org/2000/svg" width="495" height="230" viewBox="0 0 495 230" role="img" aria-label="GITHUB STATS">
<title>GITHUB STATS</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#16162b" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset="1" stop-color="#ff2a6d"/>
  </linearGradient>
  <clipPath id="cut"><path d="M18,1 H494 V212 L477,229 H1 V18 Z"/></clipPath>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #e2e2f0; }
  .t { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .lbl { font-size: 12px; fill: #7a7a9e; letter-spacing: 1px; }
  .val { font-size: 13px; font-weight: 700; }
  .sm { font-size: 11px; fill: #7a7a9e; }
  .big { font-size: 34px; font-weight: 800; }
  .flicker { animation: flicker 6s infinite; }
  .sweep { animation: sweep 7s linear infinite; }
  .rise { animation: rise .9s ease-out both; }
  @keyframes flicker { 0%,92%,96%,100% { opacity: 1; } 94% { opacity: .35; } }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(270px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .flicker, .sweep, .rise { animation: none; } }
</style>
<g clip-path="url(#cut)">
  <rect width="495" height="230" fill="#07070d"/>
  <rect width="495" height="230" fill="url(#grid)"/>
  <rect width="495" height="230" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="495" height="38" fill="#00f0ff" opacity="0.035"/>
</g>
<path d="M18,1 H494 V212 L477,229 H1 V18 Z" fill="none" stroke="url(#edge)" stroke-width="2"/>
<path d="M1,48 V18 L18,1 H78" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#glow)"/>
<path d="M494,182 V212 L477,229 H417" fill="none" stroke="#ff2a6d" stroke-width="4" filter="url(#glow)"/>
<g transform="translate(28,38)" class="flicker">
  <text class="t" x="2" y="1" style="fill:#ff2a6d" opacity="0.7">GITHUB STATS</text>
  <text class="t" x="-1.5" y="-1" style="fill:#00f0ff" opacity="0.7">GITHUB STATS</text>
  <text class="t" x="0" y="0">GITHUB STATS</text>
</g>
<text class="sm" x="471" y="34" text-anchor="end" style="fill:#00f0ff">// STAT.01</text>
<rect x="28" y="50" width="439" height="1" fill="#00f0ff" opacity="0.35"/>
<g class="rise" style="animation-delay:0.00s"><rect x="28" y="71" width="4" height="10" fill="#f9f002"/><text class="lbl" x="40" y="80">TOTAL STARS</text><text class="val" x="300" y="80" text-anchor="end" style="fill:#f9f002">0</text></g>
<g class="rise" style="animation-delay:0.08s"><rect x="28" y="92" width="4" height="10" fill="#00f0ff"/><text class="lbl" x="40" y="101">COMMITS (2026)</text><text class="val" x="300" y="101" text-anchor="end" style="fill:#00f0ff">1.2k</text></g>
<g class="rise" style="animation-delay:0.16s"><rect x="28" y="113" width="4" height="10" fill="#00f0ff"/><text class="lbl" x="40" y="122">TOTAL COMMITS</text><text class="val" x="300" y="122" text-anchor="end" style="fill:#00f0ff">1.8k</text></g>
<g class="rise" style="animation-delay:0.24s"><rect x="28" y="134" width="4" height="10" fill="#ff2a6d"/><text class="lbl" x="40" y="143">PULL REQUESTS</text><text class="val" x="300" y="143" text-anchor="end" style="fill:#ff2a6d">10</text></g>
<g class="rise" style="animation-delay:0.32s"><rect x="28" y="155" width="4" height="10" fill="#b026ff"/><text class="lbl" x="40" y="164">ISSUES</text><text class="val" x="300" y="164" text-anchor="end" style="fill:#b026ff">6</text></g>
<g class="rise" style="animation-delay:0.40s"><rect x="28" y="176" width="4" height="10" fill="#05ffa1"/><text class="lbl" x="40" y="185">CONTRIBUTED TO</text><text class="val" x="300" y="185" text-anchor="end" style="fill:#05ffa1">0</text></g>
<g class="rise" style="animation-delay:0.48s"><rect x="28" y="197" width="4" height="10" fill="#f9f002"/><text class="lbl" x="40" y="206">FOLLOWERS</text><text class="val" x="300" y="206" text-anchor="end" style="fill:#f9f002">19</text></g>
<polygon points="445.2,111.0 445.2,169.0 395.0,198.0 344.8,169.0 344.8,111.0 395.0,82.0" fill="#0d0d18" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
<polygon points="445.2,111.0 445.2,169.0 395.0,198.0 344.8,169.0 344.8,111.0 395.0,82.0" fill="none" stroke="#ff2a6d" stroke-width="1" transform="rotate(30 395 140) scale(1)" opacity="0.5"/>
<text x="395" y="144" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#00f0ff">2k</text>
<text x="395" y="162" text-anchor="middle" class="sm">CONTRIBS</text>
<text x="395" y="218" text-anchor="middle" class="sm" style="fill:#ff2a6d">ALL-TIME</text>
</svg>
