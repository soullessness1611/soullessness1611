  .sm { font-size: 11px; fill: #8a8273; }
  .flicker {  }
  .rise { animation: rise 1.1s ease-out both; }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flicker, .sweep, .rise { animation: none; } }
</style>
