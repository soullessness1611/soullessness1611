<svg xmlns="http://www.w3.org/2000/svg" width="495" height="230" viewBox="0 0 495 230" role="img" aria-label="GITHUB STATS">
<title>GITHUB STATS</title>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feMerge><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  text { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Noto Serif',Georgia,serif; fill: #e9e2d2; }
  .t { font-size: 17px; font-weight: 600; letter-spacing: 5px; }
