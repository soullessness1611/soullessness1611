<svg xmlns="http://www.w3.org/2000/svg" width="495" height="260" viewBox="0 0 495 260" role="img" aria-label="REPOSITORIES &amp; STARS">
<title>REPOSITORIES &amp; STARS</title>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#16162b" stroke-width="1"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f9f002"/>
    <stop offset="1" stop-color="#ff2a6d"/>
  </linearGradient>
  <clipPath id="cut"><path d="M18,1 H494 V242 L477,259 H1 V18 Z"/></clipPath>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill: #e2e2f0; }
  .t { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .lbl { font-size: 12px; fill: #7a7a9e; letter-spacing: 1px; }
  .val { font-size: 13px; font-weight: 700; }
  .sm { font-size: 11px; fill: #7a7a9e; }
  .big { font-size: 34px; font-weight: 800; }
  .flicker { animation: flicker 6s infinite; }
  .sweep { animation: sweep 7s linear infinite; }
  .rise { animation: rise .9s ease-out both; }
  @keyframes flicker { 0%,92%,96%,100% { opacity: 1; } 94% { opacity: .35; } }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .flicker, .sweep, .rise { animation: none; } }
</style>
<g clip-path="url(#cut)">
  <rect width="495" height="260" fill="#07070d"/>
  <rect width="495" height="260" fill="url(#grid)"/>
  <rect width="495" height="260" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="495" height="38" fill="#f9f002" opacity="0.035"/>
</g>
<path d="M18,1 H494 V242 L477,259 H1 V18 Z" fill="none" stroke="url(#edge)" stroke-width="2"/>
<path d="M1,48 V18 L18,1 H78" fill="none" stroke="#f9f002" stroke-width="4" filter="url(#glow)"/>
<path d="M494,212 V242 L477,259 H417" fill="none" stroke="#ff2a6d" stroke-width="4" filter="url(#glow)"/>
